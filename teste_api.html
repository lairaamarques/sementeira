<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Teste de API - EcoSemente BI</title>
    <script src="https://unpkg.com/vue@3.5.13/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f5f2; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin-bottom: 20px; }
        input, select, button { display: block; width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { background: #2d5a40; color: white; border: none; cursor: pointer; }
        li { margin-bottom: 6px; }
        li button { display: inline; width: auto; padding: 2px 8px; margin-left: 8px; background: #b85c1e; }
        .erro { color: #be123c; }
    </style>
</head>
<body>
    <div id="app">
        <p v-if="erro" class="erro">{{ erro }}</p>

        <div class="card">
            <h2>Cadastrar Nome Científico</h2>
            <form @submit.prevent="salvarNomeCientifico">
                <input v-model="novoNome.nomePopular" placeholder="Nome Popular (ex: Andiroba)" required>
                <input v-model="novoNome.nome" placeholder="Nome Científico (ex: Carapa guianensis)" required>
                <button type="submit">Salvar nome científico</button>
            </form>
        </div>

        <div class="card">
            <h2>Cadastrar Semente</h2>
            <form @submit.prevent="salvarSemente">
                <input v-model="novaSemente.nome" placeholder="Nome (ex: Andiroba)" required>
                <input v-model="novaSemente.especie" placeholder="Espécie">
                <select v-model="novaSemente.nomeCientificoId">
                    <option :value="null">— Nome científico (opcional) —</option>
                    <option v-for="n in nomes" :key="n.id" :value="n.id">{{ n.nomePopular }} ({{ n.nome }})</option>
                </select>
                <select v-model="novaSemente.tipoCultivo">
                    <option value="Sementes">Sementes / Sacas</option>
                    <option value="Mudas">Mudas / Viveiro</option>
                </select>
                <input v-model.number="novaSemente.tempoMedioColheita" type="number" placeholder="Tempo médio de colheita (dias)">
                <input v-model.number="novaSemente.quantidade" type="number" placeholder="Quantidade">
                <input v-model.number="novaSemente.preco" type="number" step="0.01" placeholder="Preço (R$)">
                <button type="submit">Salvar semente</button>
            </form>
        </div>

        <div class="card">
            <h2>Sementes no Banco de Dados</h2>
            <ul>
                <li v-for="s in sementes" :key="s.id">
                    <strong>{{ s.nome }}</strong>
                    <span v-if="s.nomeCientificoId"> ({{ nomeCientificoDe(s.nomeCientificoId) }})</span>
                    — {{ s.tipoCultivo || 'sem tipo' }} · qtd {{ s.quantidade ?? 0 }}
                    <button @click="deletarSemente(s.id)">Excluir</button>
                </li>
            </ul>
        </div>
    </div>

    <script>
        const { createApp } = Vue
        const API = 'http://localhost:8081/api'

        const sementeVazia = () => ({
            nome: '', especie: '', nomeCientificoId: null, tipoCultivo: 'Sementes',
            tempoMedioColheita: null, quantidade: null, preco: null
        })

        createApp({
            data() {
                return {
                    erro: '',
                    sementes: [],
                    nomes: [],
                    novaSemente: sementeVazia(),
                    novoNome: { nome: '', nomePopular: '' }
                }
            },
            methods: {
                falhou(acao, error) {
                    console.error(acao, error)
                    this.erro = `${acao}: ${error.message} (o backend está rodando na porta 8081?)`
                },
                nomeCientificoDe(id) {
                    const n = this.nomes.find(x => x.id === id)
                    return n ? n.nome : `id ${id}`
                },
                buscarSementes() {
                    axios.get(`${API}/semente`)
                        .then(r => { this.sementes = r.data; this.erro = '' })
                        .catch(e => this.falhou('Erro ao buscar sementes', e))
                },
                buscarNomes() {
                    axios.get(`${API}/nome-cientifico`)
                        .then(r => { this.nomes = r.data })
                        .catch(e => this.falhou('Erro ao buscar nomes científicos', e))
                },
                salvarSemente() {
                    axios.post(`${API}/semente`, this.novaSemente)
                        .then(() => { this.novaSemente = sementeVazia(); this.buscarSementes() })
                        .catch(e => this.falhou('Erro ao salvar semente', e))
                },
                salvarNomeCientifico() {
                    axios.post(`${API}/nome-cientifico`, this.novoNome)
                        .then(() => { this.novoNome = { nome: '', nomePopular: '' }; this.buscarNomes() })
                        .catch(e => this.falhou('Erro ao salvar nome científico', e))
                },
                deletarSemente(id) {
                    axios.delete(`${API}/semente/${id}`)
                        .then(() => this.buscarSementes())
                        .catch(e => this.falhou('Erro ao excluir semente', e))
                }
            },
            mounted() {
                this.buscarNomes()
                this.buscarSementes()
            }
        }).mount('#app')
    </script>
</body>
</html>
